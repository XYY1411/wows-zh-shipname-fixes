name: 同步 ModSDK 翻译

on:
  workflow_dispatch:      # 手动触发
  schedule:
    - cron: '0 3 * * *'   # 每天 03:00 UTC (北京时间 11:00) 检查新版本

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install polib openpyxl

      - name: 同步翻译文件
        run: python scripts/sync_translations.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成版本表格与差异
        run: python scripts/generate_tables.py

      - name: 提交并推送
        timeout-minutes: 5
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add translations/ templates/ scripts/ .github/
          # 只认 mo/po/csv 这些确定性数据源是否有实质变化。
          # xlsx/xlsm 每次生成都会写入不同的 created/modified 时间戳,
          # 即使内容没变字节也会变, 会让 git 误判为"有修改"。所以不把它们当提交依据。
          if git diff --cached --name-only --diff-filter=ACM | grep -Ei '\.(mo|po|csv)$' | grep -q .; then
            git commit -m "同步 ModSDK 翻译并生成版本表格"
            echo "开始推送..."
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
            echo "推送完成"
          else
            # 没有实质翻译变化: 丢弃 xlsx/xlsm 的时间戳噪声, 不提交
            git checkout -- translations/ templates/ scripts/ .github/ 2>/dev/null || true
            echo "没有新的翻译内容（仅有表格时间戳噪声），不提交"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
