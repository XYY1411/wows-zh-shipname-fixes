name: 同步 ModSDK 翻译

on:
  workflow_dispatch:      # 手动触发
  schedule:
    - cron: '0 3 * * *'   # 每天 03:00 UTC (北京时间 11:00) 检查新版本

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install polib openpyxl

      - name: 同步翻译文件
        run: python scripts/sync_translations.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成版本表格与差异
        run: python scripts/generate_tables.py

      - name: 提交并推送
        timeout-minutes: 5
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add translations/ templates/ scripts/ .github/
          if git diff --cached --quiet; then
            echo "没有新内容，无需提交"
          else
            git commit -m "同步 ModSDK 翻译并生成版本表格"
            echo "开始推送..."
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
            echo "推送完成"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
